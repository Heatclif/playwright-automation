name: GitHub Pages (helper workflow) 

# Reusable workflow: merge every allure-results_* artifact of this run with the history
# from the previous report on gh-pages, build one report, upload it and publish to gh-pages.
on:
  workflow_call:
    inputs:
      publish:
        description: 'Publish the combined report to the gh-pages branch'
        required: false
        type: boolean
        default: true

concurrency:
  group: allure-gh-pages
  cancel-in-progress: false

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results from this run
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results_*
          path: allure-results
          merge-multiple: true

      - name: Pull previous report from gh-pages
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore history into the results
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/. allure-results/history/
            echo "Restored $(ls allure-results/history | wc -l) history files"
          else
            echo "No previous history found, starting fresh"
          fi

      - name: Generate combined Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload combined Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report_combined
          path: allure-report/
          retention-days: 5

      - name: Publish to gh-pages
        if: ${{ inputs.publish }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true
